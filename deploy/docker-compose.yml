services:

  mysql:
    image: mysql:8.4.11
    container_name: pump-iot-mysql

    environment:
      MYSQL_ROOT_PASSWORD: pump_iot_root
      MYSQL_DATABASE: pump_iot
      MYSQL_USER: pump_iot
      MYSQL_PASSWORD: pump_iot_dev
      TZ: Asia/Shanghai

    ports:
      - "13306:3306"

    volumes:
      - pump_iot_mysql_data:/var/lib/mysql

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-ppump_iot_root"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8.10.2-alpine
    container_name: pump-iot-redis

    ports:
      - "127.0.0.1:16379:6379"

    environment:
      REDISCLI_AUTH: pump_iot_redis

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - pump_iot_redis

    volumes:
      - pump_iot_redis_data:/data

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: pump-iot-mosquitto

    ports:
      - "127.0.0.1:11883:1883"

    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - pump_iot_mosquitto_data:/mosquitto/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_pub",
          "-h",
          "localhost",
          "-p",
          "1883",
          "-t",
          "health",
          "-m",
          "ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: pump-iot-kafka

    ports:
      - "127.0.0.1:19092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

    volumes:
      - pump_iot_kafka_data:/var/lib/kafka/data

    restart: unless-stopped

  tdengine:
    image: tdengine/tsdb:3.4.2.8
    container_name: pump-iot-tdengine

    ports:
      - "127.0.0.1:16041:6041"

    volumes:
      - pump_iot_tdengine_data:/var/lib/taos
      - pump_iot_tdengine_log:/var/log/taos

    restart: unless-stopped

  postgis:
    image: postgis/postgis:17-3.5
    container_name: pump-iot-postgis

    environment:
      POSTGRES_DB: pump_iot_geo
      POSTGRES_USER: pump_iot_geo
      POSTGRES_PASSWORD: pump_iot_geo_dev
      TZ: Asia/Shanghai

    ports:
      - "127.0.0.1:15432:5432"

    volumes:
      - pump_iot_postgis_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U pump_iot_geo -d pump_iot_geo"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  geoserver:
    image: docker.osgeo.org/geoserver:3.0.1
    container_name: pump-iot-geoserver

    ports:
      - "127.0.0.1:18080:8080"

    environment:
      EXTRA_JAVA_OPTS: "-Xms512m -Xmx1024m"

    volumes:
      - pump_iot_geoserver_data:/opt/geoserver_data

    restart: unless-stopped

    depends_on:
      postgis:
        condition: service_healthy


  nacos:
    image:
      nacos/nacos-server:v3.2.4

    container_name:
      pump-iot-nacos

    environment:
      MODE:
        standalone
      PREFER_HOST_MODE:
        hostname
      NACOS_AUTH_ENABLE:
        "false"
      NACOS_AUTH_TOKEN:
        cHVtcC1pb3QtbmFjb3MtbG9jYWwtZGV2ZWxvcG1lbnQtc2VjcmV0LTIwMjYtMDk=
      NACOS_AUTH_IDENTITY_KEY:
        pumpIotServerIdentity
      NACOS_AUTH_IDENTITY_VALUE:
        pumpIotLocalSecurity

    ports:
      - "127.0.0.1:18048:8080"
      - "127.0.0.1:18848:8848"
      - "127.0.0.1:19848:9848"
    volumes:
      - pump_iot_nacos_logs:/home/nacos/logs
    restart:
      unless-stopped

  iot-server:

    build:

      context: ..

      dockerfile:
        sxupr-module-iot-server/Dockerfile

    container_name:
      pump-iot-server

    environment:

      NACOS_ADDR:
        nacos:8848

      MYSQL_HOST:
        mysql

      MYSQL_PORT:
        3306

      REDIS_HOST:
        redis

      REDIS_PORT:
        6379

      KAFKA_ADDR:
        kafka:29092

      TDENGINE_HOST:
        tdengine

      TDENGINE_PORT:
        6041

      POSTGIS_HOST:
        postgis

      POSTGIS_PORT:
        5432

    ports:

      - "127.0.0.1:18082:18082"

      - "127.0.0.1:19090:19090"

    depends_on:

      - mysql
      - redis
      - kafka
      - tdengine
      - postgis
      - nacos

    restart:
      unless-stopped

  iot-gateway:

    build:

      context: ..

      dockerfile:
        sxupr-module-iot-gateway/Dockerfile

    container_name:
      pump-iot-gateway

    environment:

      MQTT_BROKER_URI:
        tcp://mosquitto:1883

      KAFKA_ADDR:
        kafka:29092

      IOT_SERVER_GRPC_HOST:
        iot-server

      IOT_SERVER_GRPC_PORT:
        19090

    depends_on:

      - mosquitto
      - kafka
      - iot-server

    restart:
      unless-stopped

  device-simulator:

    build:

      context: ..

      dockerfile:
        sxupr-device-simulator/Dockerfile

    container_name:
      pump-iot-simulator

    environment:

      MQTT_BROKER_URI:
        tcp://mosquitto:1883

    depends_on:

      - mosquitto

    restart:
      unless-stopped

  api-gateway:

    build:

      context: ..

      dockerfile:
        sxupr-api-gateway/Dockerfile

    container_name:
      pump-iot-api-gateway

    environment:

      NACOS_ADDR:
        nacos:8848

    ports:

      - "127.0.0.1:18081:18081"

    depends_on:

      - nacos
      - iot-server

    restart:
      unless-stopped

  web:

    build:

      context: ..

      dockerfile:
        sxupr-ui-admin-vue3/Dockerfile

    container_name:
      pump-iot-web

    ports:

      - "18000:80"

    depends_on:

      - api-gateway
      - geoserver

    restart:
      unless-stopped

volumes:
  pump_iot_mysql_data:
  pump_iot_redis_data:
  pump_iot_mosquitto_data:
  pump_iot_kafka_data:
  pump_iot_tdengine_data:
  pump_iot_tdengine_log:
  pump_iot_postgis_data:
  pump_iot_geoserver_data:
  pump_iot_nacos_logs: